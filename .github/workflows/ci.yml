name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-type-test:
    name: gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # py3.9 dropped: EOL 2025-10-31 and its install leg was the standing
        # CI red (docs/DECISIONS.md D-P1); requires-python is now >=3.10.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2 (pinned SHA)

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (pinned SHA)
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (declared manifests)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Download spaCy model (BLOCKING - the former '|| true' masked failures)
        run: python -m spacy download en_core_web_sm

      - name: Lint (ruff)
        run: ruff check .  # whole repo: root apps were never linted by the old scope

      - name: Typecheck (mypy, BLOCKING - former '|| true' removed; third-party
          parse scope limited via pyproject overrides after OOM, first-party strict)
        run: mypy src

      - name: Suppression audit (mission rule 4.7)
        run: python scripts/audit_suppressions.py --check

      - name: Tests + coverage over ALL of src (generator included; floor 60, measured 67)
        run: pytest tests --cov=src --cov-report=term-missing --cov-fail-under=60

      - name: Tracked-file drift guard
        run: |
          git diff --exit-code
          echo "drift guard: worktree clean after test run"

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2 (pinned SHA)

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (pinned SHA)
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: pip-audit (BLOCKING, --strict)
        run: pip-audit -r requirements.txt --strict --progress-spinner off

      - name: bandit (BLOCKING - former '|| true' removed; B311 eliminated at the source)
        run: bandit -r src -q
